name: Verify Everywhere candidate
on:
  push:
    branches: [feat/everywhere]
    paths: [.github/everywhere-transfer.json]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'LSthemagic/nyrva' && github.ref == 'refs/heads/feat/everywhere'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate bounded patch against the recorded base
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,io,json,pathlib,subprocess
          path=pathlib.Path('.github/everywhere-transfer.json')
          raw=path.read_bytes(); assert len(raw)<65536
          v=json.loads(raw); assert set(v)=={'base','sha256','parts'}
          assert v['base']=='93a0baeab7da8037aaff0049b4d5d9df37f8aab6'
          assert v['parts']==['.github/everywhere-part-1.b64','.github/everywhere-part-2.b64','.github/everywhere-part-3.b64','.github/everywhere-part-4.b64']
          subprocess.run(['git','merge-base','--is-ancestor',v['base'],'HEAD'],check=True)
          encoded=''.join(pathlib.Path(p).read_text().strip() for p in v['parts']); assert len(encoded)<65536
          compressed=base64.b64decode(encoded,validate=True)
          with gzip.GzipFile(fileobj=io.BytesIO(compressed)) as f: patch=f.read(1048577)
          assert len(patch)<1048576 and hashlib.sha256(patch).hexdigest()==v['sha256']
          p=pathlib.Path('/tmp/everywhere.patch');p.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(p)],check=True)
          subprocess.run(['git','apply',str(p)],check=True)
          allowed=lambda p: (p.startswith('nyrva-core/') or p=='Cargo.lock' or p in ['docs/superpowers/plans/2026-09-23-everywhere.md','docs/superpowers/sdd/2026-09-23-everywhere.md']) and '..' not in pathlib.PurePosixPath(p).parts and '\\' not in p
          changed=subprocess.check_output(['git','status','--porcelain','--untracked-files=all']).decode().splitlines()
          for line in changed:
              assert allowed(line[3:]), 'path outside scoped implementation: '+line
              assert not pathlib.Path(line[3:]).is_symlink()
          subprocess.run(['git','add','--','nyrva-core','Cargo.lock','docs/superpowers/plans/2026-09-23-everywhere.md','docs/superpowers/sdd/2026-09-23-everywhere.md'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
      - name: Run all core contracts without exceptions
        run: |
          set -o pipefail
          mkdir -p candidate-evidence
          cargo test -p nyrva-core --locked --no-fail-fast 2>&1 | tee candidate-evidence/core.log
          cargo build -p nyrva-core --bin nyrva-telemetry --locked
          python scripts/smoke_telemetry.py --binary target/debug/nyrva-telemetry --output candidate-evidence/telemetry.json
          git diff --exit-code -- Cargo.lock
      - name: Remove one-shot transfer
        run: git rm .github/everywhere-transfer.json .github/everywhere-part-{1,2,3,4}.b64 .github/workflows/everywhere-candidate.yml
      - name: Create candidate only, without changing any branch
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),cp=require('child_process');
            const {owner,repo}=context.repo,parent=context.sha;
            const current=await github.rest.git.getCommit({owner,repo,commit_sha:parent});
            const changed=cp.execFileSync('git',['diff','--cached','--name-only','-z']).toString().split('\0').filter(Boolean);
            const removed=new Set(['.github/everywhere-transfer.json','.github/workflows/everywhere-candidate.yml',...Array.from({length:4},(_,i)=>`.github/everywhere-part-${i+1}.b64`)]);
            const docs=new Set(['docs/superpowers/plans/2026-09-23-everywhere.md','docs/superpowers/sdd/2026-09-23-everywhere.md']);
            const entries=[];
            for(const path of changed){
              if(!(path.startsWith('nyrva-core/')||path==='Cargo.lock'||docs.has(path)||removed.has(path))||path.includes('..')) throw Error('candidate path outside scope');
              if(!fs.existsSync(path)){if(!removed.has(path))throw Error('unexpected deletion');entries.push({path,mode:'100644',type:'blob',sha:null});continue;}
              const blob=await github.rest.git.createBlob({owner,repo,content:fs.readFileSync(path).toString('base64'),encoding:'base64'});
              entries.push({path,mode:'100644',type:'blob',sha:blob.data.sha});
            }
            const tree=await github.rest.git.createTree({owner,repo,base_tree:current.data.tree.sha,tree:entries});
            const commit=await github.rest.git.createCommit({owner,repo,message:'feat(everywhere): verified terminal, reversible integrations, private API and signed artifact verification',tree:tree.data.sha,parents:[parent]});
            fs.writeFileSync('candidate-evidence/candidate.json',JSON.stringify({parent,commit:commit.data.sha,tree:tree.data.sha,paths:changed,ref_updated:false},null,2));
            core.notice(`Candidate ${commit.data.sha}; no refs updated`);
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: everywhere-candidate
          path: candidate-evidence/
          retention-days: 7
