name: Nyrva Everywhere
on:
  push:
    branches: [feat/everywhere]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  source:
    name: Reproducible source checkpoint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          mkdir -p evidence
          git archive --format=tar.gz HEAD > evidence/source.tar.gz
          git rev-parse HEAD > evidence/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: everywhere-source
          path: evidence/
          retention-days: 7
  core:
    name: All core contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Full core suite, no skipped tests
        shell: bash
        run: |
          mkdir -p evidence
          set +e
          cargo test -p nyrva-core --locked --no-fail-fast > evidence/core.log 2>&1
          result=$?
          tail -90 evidence/core.log
          exit $result
      - name: PowerShell-parent regression for Python contracts and the real CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_everywhere_http.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'HTTP and PowerShell regression failed' }
          python scripts/smoke_everywhere.py --binary target/debug/nyrva-telemetry.exe --output evidence/powershell-parent.json
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell-parent acceptance failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: everywhere-core-${{ runner.os }}
          path: evidence/
          retention-days: 7
  distribution:
    name: Complete distribution acceptance
    uses: ./.github/workflows/ci.yml
  experience:
    name: Native Experience regression
    uses: ./.github/workflows/experience-close.yml
