name: Nyrva core contracts

on:
  push:
    branches: [feat/nyrva-1.0]
  pull_request:
    paths:
      - 'nyrva-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/core.yml'

permissions:
  contents: read

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Core contract tests
        shell: bash
        run: |
          set -o pipefail
          cargo test -p nyrva-core --no-fail-fast -- --nocapture 2>&1 | tee core-tests.log
      - name: Preserve reproducible source and resolved lockfile
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p verification
          git archive --format=tar.gz HEAD > verification/source.tar.gz
          cp Cargo.lock verification/Cargo.lock
          cp core-tests.log verification/core-tests.log
          git rev-parse HEAD > verification/commit.txt
      - name: Upload verification evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: nyrva-core-evidence
          path: verification/
          retention-days: 7
          if-no-files-found: error

  # Temporary bootstrap for this implementation branch only. The authoring
  # environment cannot run Cargo; the lockfile must come from Cargo, not hand edits.
  # No PR code gets a write token and neither main nor tags can be pushed here.
  resolve-feature-lock:
    needs: contracts
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/nyrva-1.0'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate and verify the feature lockfile
        run: |
          cargo metadata --format-version 1 > /dev/null
          cargo test -p nyrva-core --locked
      - name: Commit only Cargo.lock on the unchanged feature branch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then exit 0; fi
          git fetch origin feat/nyrva-1.0
          if [ "$(git rev-parse FETCH_HEAD)" != "$EXPECTED_HEAD" ]; then
            echo 'Feature branch advanced; a subsequent run will reconcile the lockfile.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Cargo.lock
          git commit -m 'build: resolve Nyrva core workspace lockfile'
          git push origin HEAD:refs/heads/feat/nyrva-1.0
