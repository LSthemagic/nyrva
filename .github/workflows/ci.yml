name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  release-tools:
    name: Release tooling tests
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test release version and asset guards
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  windows:
    name: Windows Rust workspace
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: experience-completion
          cache-on-failure: true
      - name: Prepare Windows sidecar
        shell: pwsh
        run: ./scripts/prepare-windows-sidecar.ps1 debug
      - name: Cargo check
        run: cargo check --workspace --locked
      - name: Cargo test
        run: cargo test --workspace --locked --no-fail-fast
      - name: Build and exercise desktop telemetry commands
        run: |
          cargo build -p nyrva --locked
          python scripts/smoke_telemetry.py --binary target/debug/nyrva.exe --output target/telemetry-smoke.json
      - name: Everywhere black-box acceptance for desktop and standalone CLI
        shell: bash
        run: |
          mkdir -p target/everywhere-evidence
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          python scripts/smoke_everywhere.py --binary "target/debug/nyrva$suffix" --output target/everywhere-evidence/desktop.json
          python scripts/smoke_everywhere.py --binary "target/debug/nyrva-telemetry$suffix" --output target/everywhere-evidence/standalone.json
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked
      - name: Prepare release sidecar
        shell: pwsh
        run: ./scripts/prepare-windows-sidecar.ps1 release
      - name: Build Windows NSIS installer
        working-directory: nyrva
        run: cargo tauri build
      - name: Verify Windows installer and hook sidecar
        shell: pwsh
        run: |
          $hostTriple = (rustc -vV | Select-String '^host: ' | ForEach-Object { $_.Line.Substring(6) }).Trim()
          $sidecar = "nyrva/binaries/nyrva-hook-$hostTriple.exe"
          if (-not (Test-Path $sidecar)) { throw "missing prepared sidecar: $sidecar" }

          $installer = Get-ChildItem target/release/bundle/nsis -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'missing NSIS installer' }
          Write-Host "installer=$($installer.FullName)"

          $manifest = (& 7z l $installer.FullName | Out-String)
          if ($LASTEXITCODE -ne 0) { throw '7z could not inspect the NSIS installer' }
          if ($manifest -notmatch '(?i)nyrva-hook\.exe') {
            Write-Host $manifest
            throw 'NSIS installer does not contain nyrva-hook.exe'
          }
          if ($manifest -notmatch '(?i)nyrva-telemetry\.exe') { throw 'NSIS installer is missing the standalone CLI' }
          foreach ($notice in @('LICENSE', 'CREDITS.md', 'PROVIDER_GLYPH_NOTICES.md')) {
            $pattern = '(?im)(?:^|[\\/\s])' + [regex]::Escape($notice) + '\r?$'
            if ($manifest -notmatch $pattern) { throw "NSIS installer does not contain $notice" }
          }
      - name: Install Windows package into an isolated directory and verify both entrypoints
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem target/release/bundle/nsis -Filter '*.exe' | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP ('nyrva-package-' + [guid]::NewGuid().ToString())
          $p = Start-Process -FilePath $installer.FullName -ArgumentList "/S /D=$installDir" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'isolated installer timed out' }
          if ($p.ExitCode -ne 0) { throw "isolated installer failed: $($p.ExitCode)" }
          foreach ($binary in @('nyrva','nyrva-hook','nyrva-telemetry')) {
            if (-not (Test-Path (Join-Path $installDir "$binary.exe"))) { throw "installed $binary missing" }
          }
          # The installer must expose the standalone CLI to future terminals
          # through the per-user PATH.
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          $entries = @($userPath -split ';' | ForEach-Object { $_.TrimEnd('\') } | Where-Object { $_ })
          if ($entries -notcontains $installDir.TrimEnd('\')) {
            throw "installer did not add its directory to the user PATH: $userPath"
          }
          $env:Path = "$installDir;$env:Path"
          $resolved = (Get-Command nyrva-telemetry.exe -ErrorAction Stop).Source
          if ([IO.Path]::GetFullPath($resolved) -ne [IO.Path]::GetFullPath((Join-Path $installDir 'nyrva-telemetry.exe'))) {
            throw "nyrva-telemetry resolves to an unexpected executable: $resolved"
          }
          & nyrva-telemetry.exe status --json | Set-Content -Encoding utf8 target/everywhere-evidence/path-cli.json
          if ($LASTEXITCODE -ne 0) { throw 'PATH CLI invocation failed' }

          python scripts/smoke_everywhere.py --binary (Join-Path $installDir 'nyrva-telemetry.exe') --output target/everywhere-evidence/installed-cli.json
          if ($LASTEXITCODE -ne 0) { throw 'installed CLI acceptance failed' }
          python scripts/smoke_everywhere.py --binary (Join-Path $installDir 'nyrva.exe') --output target/everywhere-evidence/installed-desktop.json
          if ($LASTEXITCODE -ne 0) { throw 'installed desktop acceptance failed' }
      - name: Preserve Windows acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everywhere-distribution-Windows
          path: target/everywhere-evidence/
          retention-days: 7
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: nyrva-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  linux:
    name: Linux Rust workspace
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: experience-completion
          cache-on-failure: true
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            xdg-utils
      - name: Prepare Linux sidecar
        run: bash scripts/prepare-linux-sidecar.sh debug
      - name: Cargo check
        run: cargo check --workspace --locked
      - name: Verify Cargo.lock is up to date
        run: git diff --exit-code -- Cargo.lock
      - name: Cargo test
        run: cargo test --workspace --locked --no-fail-fast
      - name: Build and exercise desktop telemetry commands without a display
        run: |
          cargo build -p nyrva --locked
          python scripts/smoke_telemetry.py --binary target/debug/nyrva --output target/telemetry-smoke.json
      - name: Everywhere black-box acceptance for desktop and standalone CLI
        shell: bash
        run: |
          mkdir -p target/everywhere-evidence
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          python scripts/smoke_everywhere.py --binary "target/debug/nyrva$suffix" --output target/everywhere-evidence/desktop.json
          python scripts/smoke_everywhere.py --binary "target/debug/nyrva-telemetry$suffix" --output target/everywhere-evidence/standalone.json
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked
      - name: Prepare release sidecar
        run: bash scripts/prepare-linux-sidecar.sh release
      - name: Build Linux bundles
        working-directory: nyrva
        run: |
          set +e
          cargo tauri build > /tmp/tauri-build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::cargo tauri build failed with exit code $status"
            grep -Ei 'error|failed|externalbin|sidecar|appimage|bundle' /tmp/tauri-build.log | tail -n 80 || true
            tail -n 120 /tmp/tauri-build.log
            exit "$status"
          fi
          tail -n 40 /tmp/tauri-build.log
      - name: Inspect Linux bundle contents
        run: |
          set -euo pipefail
          deb="$(find target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)"
          appimage="$(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$deb"
          test -n "$appimage"

          mkdir -p target/bundle-diagnostics
          printf '%s\n' "$deb" > target/bundle-diagnostics/deb-path.txt
          printf '%s\n' "$appimage" > target/bundle-diagnostics/appimage-path.txt
          dpkg-deb -c "$deb" > target/bundle-diagnostics/deb-manifest.txt

          appimage="$(realpath "$appimage")"
          chmod +x "$appimage"
          extract_dir="$(mktemp -d)"
          (
            cd "$extract_dir"
            "$appimage" --appimage-extract >/dev/null
          )
          printf '%s\n' "$extract_dir/squashfs-root" > target/bundle-diagnostics/appimage-root.txt
          find "$extract_dir/squashfs-root" -maxdepth 8 \( -type f -o -type l \) -printf '%M %p\n' \
            > target/bundle-diagnostics/appimage-manifest.txt
      - name: Verify Linux bundles and hook sidecar
        run: |
          set -euo pipefail
          grep -Eq '[[:space:]]usr/bin/nyrva-hook$' target/bundle-diagnostics/deb-manifest.txt
          grep -Eq '/usr/bin/nyrva-hook$' target/bundle-diagnostics/appimage-manifest.txt
          grep -Eq '[[:space:]]usr/bin/nyrva-telemetry$' target/bundle-diagnostics/deb-manifest.txt
          grep -Eq '/usr/bin/nyrva-telemetry$' target/bundle-diagnostics/appimage-manifest.txt
          for notice in LICENSE CREDITS.md PROVIDER_GLYPH_NOTICES.md; do
            for manifest in deb-manifest.txt appimage-manifest.txt; do
              awk -v suffix="/$notice" '
                length($NF) >= length(suffix) && substr($NF, length($NF)-length(suffix)+1) == suffix { found=1 }
                END { exit !found }
              ' "target/bundle-diagnostics/$manifest"
            done
          done
      - name: Install Debian package and exercise installed and AppImage-extracted entrypoints
        run: |
          set -euo pipefail
          deb="$(cat target/bundle-diagnostics/deb-path.txt)"
          sudo dpkg -i "$deb"
          python scripts/smoke_everywhere.py --binary /usr/bin/nyrva-telemetry --output target/everywhere-evidence/installed-cli.json
          python scripts/smoke_everywhere.py --binary /usr/bin/nyrva --output target/everywhere-evidence/installed-desktop.json
          appdir="$(cat target/bundle-diagnostics/appimage-root.txt)"
          python scripts/smoke_everywhere.py --binary "$appdir/usr/bin/nyrva-telemetry" --output target/everywhere-evidence/appimage-cli.json
          appimage="$(realpath "$(cat target/bundle-diagnostics/appimage-path.txt)")"
          root="$(mktemp -d)"
          NYRVA_DATA_DIR="$root/data" APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" doctor --json > target/everywhere-evidence/appimage-doctor.json
          python -c 'import json; assert json.load(open("target/everywhere-evidence/appimage-doctor.json"))["schema_version"] == 1'
          test ! -e "$root/data"
      - name: Preserve Linux acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everywhere-distribution-Linux
          path: |
            target/everywhere-evidence/
            target/bundle-diagnostics/
            /tmp/tauri-build.log
          retention-days: 7
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: nyrva-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
