name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  release-tools:
    name: Release tooling tests
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test release version and asset guards
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  windows:
    name: Windows Rust workspace
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare Windows sidecar
        shell: pwsh
        run: ./scripts/prepare-windows-sidecar.ps1 debug
      - name: Cargo check
        run: cargo check --workspace
      - name: Cargo test
        run: cargo test --workspace
      - name: Build and exercise desktop telemetry commands
        run: |
          cargo build -p nyrva --locked
          python scripts/smoke_telemetry.py --binary target/debug/nyrva.exe --output target/telemetry-smoke.json
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked
      - name: Prepare release sidecar
        shell: pwsh
        run: ./scripts/prepare-windows-sidecar.ps1 release
      - name: Build Windows NSIS installer
        working-directory: nyrva
        run: cargo tauri build
      - name: Verify Windows installer and hook sidecar
        shell: pwsh
        run: |
          $hostTriple = (rustc -vV | Select-String '^host: ' | ForEach-Object { $_.Line.Substring(6) }).Trim()
          $sidecar = "nyrva/binaries/nyrva-hook-$hostTriple.exe"
          if (-not (Test-Path $sidecar)) { throw "missing prepared sidecar: $sidecar" }

          $installer = Get-ChildItem target/release/bundle/nsis -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'missing NSIS installer' }
          Write-Host "installer=$($installer.FullName)"

          $manifest = (& 7z l $installer.FullName | Out-String)
          if ($LASTEXITCODE -ne 0) { throw '7z could not inspect the NSIS installer' }
          if ($manifest -notmatch '(?i)nyrva-hook\.exe') {
            Write-Host $manifest
            throw 'NSIS installer does not contain nyrva-hook.exe'
          }
          foreach ($notice in @('LICENSE', 'CREDITS.md', 'PROVIDER_GLYPH_NOTICES.md')) {
            $pattern = '(?im)(?:^|[\\/\s])' + [regex]::Escape($notice) + '\r?$'
            if ($manifest -notmatch $pattern) { throw "NSIS installer does not contain $notice" }
          }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: nyrva-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  linux:
    name: Linux Rust workspace
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            xdg-utils
      - name: Prepare Linux sidecar
        run: bash scripts/prepare-linux-sidecar.sh debug
      - name: Cargo check
        run: cargo check --workspace
      - name: Verify Cargo.lock is up to date
        run: git diff --exit-code -- Cargo.lock
      - name: Cargo test
        run: cargo test --workspace
      - name: Build and exercise desktop telemetry commands without a display
        run: |
          cargo build -p nyrva --locked
          python scripts/smoke_telemetry.py --binary target/debug/nyrva --output target/telemetry-smoke.json
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked
      - name: Prepare release sidecar
        run: bash scripts/prepare-linux-sidecar.sh release
      - name: Build Linux bundles
        working-directory: nyrva
        run: |
          set +e
          cargo tauri build > /tmp/tauri-build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::cargo tauri build failed with exit code $status"
            grep -Ei 'error|failed|externalbin|sidecar|appimage|bundle' /tmp/tauri-build.log | tail -n 80 || true
            tail -n 120 /tmp/tauri-build.log
            exit "$status"
          fi
          tail -n 40 /tmp/tauri-build.log
      - name: Inspect Linux bundle contents
        run: |
          set -euo pipefail
          deb="$(find target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)"
          appimage="$(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$deb"
          test -n "$appimage"

          mkdir -p target/bundle-diagnostics
          printf '%s\n' "$deb" > target/bundle-diagnostics/deb-path.txt
          printf '%s\n' "$appimage" > target/bundle-diagnostics/appimage-path.txt
          dpkg-deb -c "$deb" > target/bundle-diagnostics/deb-manifest.txt

          appimage="$(realpath "$appimage")"
          chmod +x "$appimage"
          extract_dir="$(mktemp -d)"
          (
            cd "$extract_dir"
            "$appimage" --appimage-extract >/dev/null
          )
          find "$extract_dir/squashfs-root" -maxdepth 8 \( -type f -o -type l \) -printf '%M %p\n' \
            > target/bundle-diagnostics/appimage-manifest.txt
      - name: Verify Linux bundles and hook sidecar
        run: |
          set -euo pipefail
          grep -Eq '[[:space:]]usr/bin/nyrva-hook$' target/bundle-diagnostics/deb-manifest.txt
          grep -Eq '/usr/bin/nyrva-hook$' target/bundle-diagnostics/appimage-manifest.txt
          for notice in LICENSE CREDITS.md PROVIDER_GLYPH_NOTICES.md; do
            for manifest in deb-manifest.txt appimage-manifest.txt; do
              awk -v suffix="/$notice" '
                length($NF) >= length(suffix) && substr($NF, length($NF)-length(suffix)+1) == suffix { found=1 }
                END { exit !found }
              ' "target/bundle-diagnostics/$manifest"
            done
          done
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: nyrva-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
