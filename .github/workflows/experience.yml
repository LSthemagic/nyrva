name: Nyrva Experience
on:
  push:
    branches: [feat/nyrva-1.0]
    paths:
      - 'nyrva/**'
      - 'nyrva-core/**'
      - 'tests/experience/**'
      - 'scripts/experience*'
      - '.github/workflows/experience.yml'
  pull_request:
permissions:
  contents: read
jobs:
  presentation:
    name: Experience presentation contracts
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Formatting, freshness and history contracts
        run: |
          set -o pipefail
          mkdir -p experience-evidence
          node --test tests/experience/*.test.mjs 2>&1 | tee experience-evidence/presentation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experience-presentation
          path: experience-evidence/
          retention-days: 7
  bridge:
    name: Shared desktop facade contracts
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Exercise the actual desktop data facade
        run: |
          set -o pipefail
          mkdir -p experience-evidence
          cargo test -p nyrva-core --locked --test experience_bridge 2>&1 | tee experience-evidence/bridge.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experience-bridge
          path: experience-evidence/
          retention-days: 7
  browser:
    name: Experience browser E2E (not native acceptance)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated browser test dependencies
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Exercise the shipped dashboard
        run: python tests/experience/browser.py --output experience-evidence/browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experience-browser
          path: experience-evidence/browser/
          retention-days: 7
