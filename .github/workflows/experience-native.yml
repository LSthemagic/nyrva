name: Nyrva Experience native
on:
  push:
    branches: [feat/nyrva-1.0]
    paths: ['nyrva/**', 'nyrva-core/**', 'Cargo.lock', 'scripts/experience*', '.github/workflows/experience-native.yml']
  pull_request:
permissions:
  contents: read
jobs:
  desktop:
    name: Desktop compile and regression (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xdg-utils
      - name: Prepare Linux sidecar
        if: runner.os == 'Linux'
        run: bash scripts/prepare-linux-sidecar.sh debug
      - name: Prepare Windows sidecar
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare-windows-sidecar.ps1 debug
      - name: Compile shipped desktop and capability manifest
        shell: bash
        run: |
          set -o pipefail
          mkdir -p experience-evidence
          cargo check -p nyrva --locked 2>&1 | tee experience-evidence/check.log
      - name: Existing desktop regressions and navigation isolation
        shell: bash
        run: |
          set -o pipefail
          cargo test -p nyrva --locked 2>&1 | tee experience-evidence/desktop-tests.log
      - name: Confirm lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experience-native-${{ runner.os }}
          path: experience-evidence/
          retention-days: 7
