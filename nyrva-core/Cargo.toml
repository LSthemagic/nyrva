[package]
name = "nyrva-core"
version = "0.1.0"
edition = "2021"
description = "Local, privacy-preserving telemetry contracts for Nyrva"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
rusqlite = { version = "0.32", features = ["bundled"] }
